<div class="fixed top-0 left-0 z-50 w-full transition-all duration-300"
     [ngClass]="{
         'py-6': !isScrolled,
         'py-2': isScrolled
       }">
  <div class="mx-auto transition-all duration-300"
       [ngClass]="{
         'w-[90%]': !isScrolled,
         'w-[80%]': isScrolled
       }">
    <nav class="flex justify-between py-2 items-center transition-all duration-300 backdrop-blur-md rounded-xl px-4">
      <!-- Logo -->
      <a class="text-3xl font-bold leading-none transition-all duration-300"
         [ngClass]="{'scale-100': !isScrolled, 'scale-90': isScrolled}" >
        <img src="images/freshcart-logo.svg" alt="Logo">
      </a>

      <!-- Mobile Menu Button -->
      <div class="lg:hidden">
        <button class="navbar-burger flex items-center text-white p-3" (click)="toggleMenu()">
          <svg class="block h-4 w-4 fill-current" viewBox="0 0 20 20">
            <path d="M0 3h20v2H0V3zm0 6h20v2H0V9zm0 6h20v2H0v-2z"></path>
          </svg>
        </button>
      </div>

      <!-- Desktop Navigation -->
      <ul *ngIf="isLogin()" class="hidden capitalize lg:flex lg:mx-auto lg:items-center lg:space-x-6">
        <li><a class="text-sm text-white hover:text-green-400 transition-colors" routerLink="/home" routerLinkActive="text-green-400">Home</a></li>
        <li><a class="text-sm text-white hover:text-green-400 transition-colors" routerLink="/brands" routerLinkActive="text-green-400">Brands</a></li>
        <li><a class="text-sm text-white hover:text-green-400 transition-colors" routerLink="/categories" routerLinkActive="text-green-400">Categories</a></li>
        <li><a class="text-sm text-white hover:text-green-400 transition-colors" routerLink="/products" routerLinkActive="text-green-400">Products</a></li>
      </ul>

      <!-- Auth Buttons for Desktop -->
      <div class="hidden lg:flex items-center space-x-2">
        <ng-container *ngIf="isLogin(); else authButtons">
          <li>
            <a class="text-sm text-white hover:text-green-400 transition-colors" routerLink="/allorders" routerLinkActive="text-green-400">
            <i class="fas fa-box-open text-2xl me-4"></i>
          </a>
        </li>
          <a class="text-sm text-white me-4 hover:text-green-400 transition-colors" routerLink="/cart" routerLinkActive="text-green-400">
            <i class="fas fa-shopping-cart text-2xl"></i>
          </a>
          <a (click)="logout()" class="py-2 px-8 text-sm text-white border border-white/30 rounded-xl hover:bg-white/10 transition duration-200 cursor-pointer">
            <i class="fas fa-sign-out-alt"></i> Logout
          </a>
        </ng-container>
        <ng-template #authButtons>
          <a class="py-2 px-8 text-sm text-white border border-white/30 rounded-xl hover:bg-white/10 transition duration-200" routerLink="/register">Sign Up</a>
          <a class="py-2 px-8 text-sm text-white border border-white/30 rounded-xl hover:bg-white/10 transition duration-200" routerLink="/login">Sign In</a>
        </ng-template>
      </div>
    </nav>

    <!-- Mobile Menu -->
    <div *ngIf="menuOpen" class="lg:hidden mobile-menu">
      <ul class="flex flex-col items-center space-y-4 py-4 bg-black/90 rounded-lg">
        <ng-container *ngIf="isLogin(); else mobileAuthButtons">
          <li><a class="text-sm text-white hover:text-green-400 transition-colors" routerLink="/home" routerLinkActive="text-green-400">Home</a></li>
          <li><a class="text-sm text-white hover:text-green-400 transition-colors" routerLink="/cart" routerLinkActive="text-green-400">
            <i class="fas fa-shopping-cart"></i>
          </a></li>
          <li><a class="text-sm text-white hover:text-green-400 transition-colors" routerLink="/brands" routerLinkActive="text-green-400">Brands</a></li>
          <li><a class="text-sm text-white hover:text-green-400 transition-colors" routerLink="/categories" routerLinkActive="text-green-400">Categories</a></li>
          <li><a class="text-sm text-white hover:text-green-400 transition-colors" routerLink="/products" routerLinkActive="text-green-400">Products</a></li>
          <li><a class="text-sm text-white hover:text-green-400 transition-colors" routerLink="/allorders" routerLinkActive="text-green-400">
            <i class="fas fa-box-open"></i> Orders
          </a></li>
          <li>
            <a (click)="logout()" class="py-2 px-8 text-sm text-white border border-white/30 rounded-xl hover:bg-white/10 transition duration-200 cursor-pointer">
              <i class="fas fa-sign-out-alt"></i> Logout
            </a>
          </li>
        </ng-container>
        <ng-template #mobileAuthButtons>
          <li><a class="py-2 px-8 text-sm text-white border border-white/30 rounded-xl hover:bg-white/10 transition duration-200" routerLink="/register">Sign Up</a></li>
          <li><a class="py-2 px-8 text-sm text-white border border-white/30 rounded-xl hover:bg-white/10 transition duration-200" routerLink="/login">Sign In</a></li>
        </ng-template>
      </ul>
    </div>
  </div>
</div>
