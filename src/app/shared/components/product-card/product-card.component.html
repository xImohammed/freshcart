<div class="group relative backdrop-blur-xl rounded-3xl shadow-lg hover:shadow-xl overflow-hidden transition duration-500 border border-gray-300/20">
  <!-- Product Image Container without the wishlist button -->
  <div [routerLink]="['/product-details', product._id]" class="cursor-pointer relative">
    <figure class="overflow-hidden relative">
      <!-- Product Image -->
      <img
        [src]="product.imageCover"
        [alt]="product.title"
        class="w-full align-middle block h-[33rem] object-cover transition-transform duration-700 ease-in-out group-hover:scale-105"
      />
    </figure>

    <!-- Product Details -->
    <div class="p-6 space-y-4 relative z-10">
      <!-- Category Name -->
      <h2 class="text-xs text-gray-400 uppercase tracking-wide font-medium">
        {{ product.category.name }}
      </h2>

      <!-- Product Title -->
      <p class="text-xl font-semibold text-white leading-snug group-hover:text-gray-200 transition-colors duration-300">
        {{ product.title.split(' ', 2).join(' ') }}
      </p>

      <!-- Price and Rating -->
      <div class="flex justify-between items-center">
        <span class="text-xl font-bold text-gray-100">
          {{ product.price | currency:'EGP' }}
        </span>

        <span class="flex items-center text-yellow-400 text-sm font-medium">
          <i class="fas fa-star mr-1"></i> {{ product.ratingsAverage }}
        </span>
      </div>
    </div>

    <!-- Glossy Overlay -->
    <div class="absolute inset-0 bg-gradient-to-t from-black/50 to-transparent rounded-3xl opacity-40 group-hover:opacity-0 transition-all duration-500"></div>
  </div>

  <!-- Wishlist Button - Removed from router link and placed outside -->
  <button
  (click)="addToWishList(product._id)"
    class="btn btn-circle absolute top-4 right-4 z-20 text-black/90 w-12 h-12 flex items-center justify-center"
  >
    <svg xmlns="http://www.w3.org/2000/svg" fill="none"
         viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"
         class="w-8 h-8">
      <path stroke-linecap="round" stroke-linejoin="round"
            d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z" />
    </svg>
  </button>

  <!-- Add To Cart Button -->
  <div class="px-6 pb-6 relative z-10">
    <a (click)="addToCart(product.id)"
       class="py-2 px-6 w-full block text-center text-sm text-gray-100 border border-gray-300/40 rounded-xl
              transform opacity-0 translate-y-4
              group-hover:translate-y-0 group-hover:opacity-100
              transition-all duration-500 ease-in-out
              whitespace-nowrap hover:bg-gray-700 hover:border-gray-500">
      Add To Cart
    </a>
  </div>
</div>
